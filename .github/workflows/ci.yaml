name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  ci:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: onchain-monitor
      image-name: onchain-monitor
      workload-dir: workloads/onchain-monitor
      go-version: "1.27.4"
    secrets: inherit

  # ── Integration Test ─────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'homelab-onchain-monitor' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start local PostgreSQL and Redis
        run: |
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]] || ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 redis-server
            sudo systemctl stop postgresql redis-server
          fi
          pg_data="$RUNNER_TEMP/postgres"
          "$pg_bin/initdb" -D "$pg_data" -U test -A trust --no-locale
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h 127.0.0.1 -k $RUNNER_TEMP" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -U test onchain_monitor_test
          redis-server --bind 127.0.0.1 --save '' --appendonly no --daemonize yes \
            --pidfile "$RUNNER_TEMP/redis.pid" --logfile "$RUNNER_TEMP/redis.log"
          redis-cli ping | grep -x PONG

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build server
        run: go build -o server ./cmd/server

      - name: Start server
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/onchain_monitor_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          TELEGRAM_BOT_TOKEN: "0000000000:fake-token-for-integration-test"
          PORT: "8080"
          FRONTEND_ORIGIN: "*"
        run: |
          ./server &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - name: Seed test user
        run: |
          PGPASSWORD=test psql -h localhost -U test -d onchain_monitor_test -c \
            "INSERT INTO telegram_users (tg_chat_id, tg_username, linked) VALUES (12345, 'test_user', true) ON CONFLICT DO NOTHING;"

      - name: Run integration tests
        run: ./scripts/integration-test.sh

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
